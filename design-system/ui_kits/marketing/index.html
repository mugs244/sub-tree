<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sub-tree â All your links, one page</title>
  <link rel="stylesheet" href="../_shared.css" />
  <link rel="stylesheet" href="./marketing.css" />
</head>
<body data-screen-label="Marketing landing">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../_shared.jsx"></script>
  <script type="text/babel" src="./LogoBar.jsx"></script>
  <script type="text/babel" src="./Testimonials.jsx"></script>
  <script type="text/babel" src="./PricingSection.jsx"></script>
  <script type="text/babel" src="./MarketingPage.jsx"></script>
  <script type="text/babel" src="./tweaks-panel.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "pricingLayout": "table"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <>
          <Landing layout={tweaks.pricingLayout} />
          <TweaksPanel title="Tweaks">
            <TweakSection label="Pricing layout">
              <TweakRadio
                label="Style"
                value={tweaks.pricingLayout}
                onChange={(v) => setTweak("pricingLayout", v)}
                options={[
                  { label: "Table", value: "table" },
                  { label: "Cards", value: "cards" },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    function Landing({ layout }) {
      return (
        <div className="mkt-root">
          <MktHeader />
          <main>
            <MktHero />
            <LogoBar />
            <MktFeatures />
            <MktHow />
            <MktMoMoHighlight />
            <Testimonials />
            <PricingSection layout={layout} />
            <div className="pr-teaser">
              <a href="./pricing.html">
                Compare every plan in detail
                <Icon name="arrowRight" size={14} />
              </a>
            </div>
            <MktCTA />
          </main>
          <MktFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
