<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  input { font-family: var(--font-sans); font-size: 14px; height: 40px; padding: 0 12px; border: 1px solid var(--border-default); border-radius: 0.5rem; background: #fff; color: var(--text-primary); outline: none; }
  input::placeholder { color: var(--text-placeholder); }
  input:focus { box-shadow: 0 0 0 2px rgba(17,24,39,0.2); border-color: var(--border-focus); }
  .helper { font-size: 12px; color: var(--text-muted); }
  .error { font-size: 12px; color: var(--state-error); }
  .mono { font-family: var(--font-mono); }
  .invalid { border-color: var(--state-error); }
</style>
</head>
<body>
<div class="field">
  <label for="i1">Username</label>
  <input id="i1" value="amara" />
  <div class="helper mono">sub-tree.com/amara</div>
</div>
<div class="field">
  <label for="i2">Mobile money number <span style="color:var(--state-error)">*</span></label>
  <input id="i2" class="mono" placeholder="07XX XXX XXX" />
  <div class="helper">MTN or Airtel Uganda</div>
</div>
<div class="field">
  <label for="i3">Display name</label>
  <input id="i3" placeholder="Your name" />
</div>
<div class="field">
  <label for="i4">URL</label>
  <input id="i4" class="mono invalid" value="not-a-url" />
  <div class="error">Enter a valid URL starting with https://</div>
</div>
</body>
</html>
