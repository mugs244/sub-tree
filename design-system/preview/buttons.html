<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
  .row + .row { margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 10px 18px; border-radius: 0.5rem; cursor: pointer; transition: background 150ms; line-height: 1; border: 1px solid transparent; }
  .btn.primary { background: #111827; color: #fff; }
  .btn.outline { border-color: var(--border-default); background: #fff; color: #111827; }
  .btn.ghost { background: transparent; color: #4b5563; }
  .btn.destructive { background: #dc2626; color: #fff; }
  .btn.sm { padding: 7px 14px; font-size: 13px; }
  .btn.icon { padding: 8px; }
  .btn:disabled, .btn.disabled { opacity: 0.5; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 80px; }
  svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="row"><div class="label">primary</div>
  <button class="btn primary">Claim your username <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
  <button class="btn primary sm">Save</button>
  <button class="btn primary" disabled>Disabled</button>
</div>
<div class="row"><div class="label">outline</div>
  <button class="btn outline">Sign in</button>
  <button class="btn outline sm">Cancel</button>
</div>
<div class="row"><div class="label">ghost</div>
  <button class="btn ghost">Back</button>
  <button class="btn ghost sm">Skip</button>
</div>
<div class="row"><div class="label">destructive</div>
  <button class="btn destructive sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete account</button>
</div>
</body>
</html>
