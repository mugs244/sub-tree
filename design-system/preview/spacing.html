<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 16px; padding: 6px 0; }
  .bar { background: #111827; height: 12px; border-radius: 2px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 80px; flex-shrink: 0; }
  .use { font-size: 12px; color: var(--text-primary); }
</style>
</head>
<body>
<div class="row"><div class="name">space-1 Â· 4</div><div class="bar" style="width:4px"></div><div class="use">inline icon offsets</div></div>
<div class="row"><div class="name">space-2 Â· 8</div><div class="bar" style="width:8px"></div><div class="use">badge padding</div></div>
<div class="row"><div class="name">space-3 Â· 12</div><div class="bar" style="width:12px"></div><div class="use">tight stacks</div></div>
<div class="row"><div class="name">space-4 Â· 16</div><div class="bar" style="width:16px"></div><div class="use">card padding (compact)</div></div>
<div class="row"><div class="name">space-5 Â· 20</div><div class="bar" style="width:20px"></div><div class="use">between form fields</div></div>
<div class="row"><div class="name">space-6 Â· 24</div><div class="bar" style="width:24px"></div><div class="use">card padding (standard)</div></div>
<div class="row"><div class="name">space-8 Â· 32</div><div class="bar" style="width:32px"></div><div class="use">card padding (hero), between page sections</div></div>
<div class="row"><div class="name">space-12 Â· 48</div><div class="bar" style="width:48px"></div><div class="use">major section break</div></div>
</body>
</html>
