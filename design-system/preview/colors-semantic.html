<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Colors â Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .group { border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; }
  .badge { padding: 10px 12px; font-size: 12px; font-weight: 500; font-family: var(--font-sans); }
  .meta { padding: 10px 12px; border-top: 1px solid var(--border-default); background: var(--bg-base); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="group">
    <div class="badge" style="background:#dcfce7;color:#16a34a">Completed</div>
    <div class="meta"><div class="name">Success</div><div class="hex">#16A34A on #DCFCE7</div></div>
  </div>
  <div class="group">
    <div class="badge" style="background:#fef3c7;color:#d97706">Pending</div>
    <div class="meta"><div class="name">Warning</div><div class="hex">#D97706 on #FEF3C7</div></div>
  </div>
  <div class="group">
    <div class="badge" style="background:#fee2e2;color:#dc2626">Failed</div>
    <div class="meta"><div class="name">Error</div><div class="hex">#DC2626 on #FEE2E2</div></div>
  </div>
  <div class="group">
    <div class="badge" style="background:#ffffff;color:#2563eb;border-bottom:1px solid var(--border-default)">3 new donations</div>
    <div class="meta"><div class="name">Info</div><div class="hex">#2563EB Â· text-only</div></div>
  </div>
</div>
</body>
</html>
