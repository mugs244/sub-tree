<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stat cards</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { display: flex; gap: 10px; padding: 14px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 0.75rem; }
  .icon-box { width: 32px; height: 32px; flex-shrink: 0; background: #fff; border: 1px solid var(--border-default); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
  .icon-box svg { width: 16px; height: 16px; }
  .value { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); line-height: 1; }
  .sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
    <div><div class="value">7</div><div class="label">Links</div></div>
  </div>
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    <div><div class="value">42</div><div class="label">Donations</div></div>
  </div>
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div><div class="value">1,284</div><div class="label">Profile views</div></div>
  </div>
  <div class="card">
    <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
    <div><div class="value">187K</div><div class="sub">UGX</div><div class="label">Total received</div></div>
  </div>
</div>
</body>
</html>
