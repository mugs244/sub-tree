<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { width: 72px; height: 56px; background: var(--bg-base); border: 1px solid var(--border-default); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="shape" style="border-radius:0.375rem"></div><div class="name">sm Â· 6</div><div class="meta">rare</div></div>
  <div class="item"><div class="shape" style="border-radius:0.5rem"></div><div class="name">md Â· 8</div><div class="meta">buttons, inputs</div></div>
  <div class="item"><div class="shape" style="border-radius:0.75rem"></div><div class="name">lg Â· 12</div><div class="meta">cards, list items</div></div>
  <div class="item"><div class="shape" style="border-radius:1rem"></div><div class="name">xl Â· 16</div><div class="meta">modals, hero sections</div></div>
  <div class="item"><div class="shape" style="border-radius:9999px"></div><div class="name">full</div><div class="meta">pills, badges</div></div>
</div>
</body>
</html>
