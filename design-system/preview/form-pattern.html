<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Form pattern</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-base); font-family: var(--font-sans); }
  .wrap { max-width: 320px; }
  .field + .field { margin-top: 20px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text-primary); }
  input { width: 100%; box-sizing: border-box; font-family: var(--font-sans); font-size: 14px; height: 40px; padding: 0 12px; border: 1px solid var(--border-default); border-radius: 0.5rem; background: #fff; color: var(--text-primary); outline: none; }
  input:focus { box-shadow: 0 0 0 2px rgba(17,24,39,0.2); border-color: var(--border-focus); }
  input::placeholder { color: var(--text-placeholder); }
  .helper { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .submit { margin-top: 20px; width: 100%; background: #111827; color: #fff; padding: 11px; border-radius: 0.5rem; border: 0; font-family: var(--font-sans); font-size: 14px; font-weight: 500; }
  .req { color: var(--state-error); }
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label>Username</label>
    <input value="amara" style="font-family:var(--font-mono)" />
    <div class="helper">sub-tree.com/amara Â· available</div>
  </div>
  <div class="field">
    <label>Display name <span class="req">*</span></label>
    <input placeholder="Your name" />
  </div>
  <button class="submit">Continue</button>
</div>
</body>
</html>
